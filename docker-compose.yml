# ==============================================================================
# Enterprise Production Docker Compose Topology
# Apex Bank International - Information Security & GRC Platform
# Services: App (Node/React), PostgreSQL 16, Redis 7, Nginx HTTP Reverse Proxy
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Bank InfoSec Application Service (Node.js 22 LTS)
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegissec-app
    restart: unless-stopped
    environment:
      # Keep production as the safe default, while allowing the local .env to
      # select the development-only authentication behavior explicitly.
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=4000
      - HOST=0.0.0.0
      - DB_TYPE=postgres
      - DATABASE_URL=postgresql://bank_admin:BankSecureAdminPass2026!@postgres:5432/bank_infosec_db?sslmode=disable
      - REDIS_ENABLED=true
      - REDIS_URL=redis://:RedisSecurePass2026!@redis:6379
      - STORAGE_PROVIDER=local
      - JWT_SECRET=aegissec-enterprise-jwt-super-secret-bank-key-2026
      - DEV_EMPTY_PASSWORD_LOGIN_ENABLED=${DEV_EMPTY_PASSWORD_LOGIN_ENABLED:-false}
      - CORS_ORIGIN=*
      - LOG_LEVEL=info
      - LDAP_ENABLED=${LDAP_ENABLED:-true}
      - LDAP_URL=${LDAP_URL:-ldaps://DC01.Expressbank.az:636}
      - LDAP_BASE_DN=${LDAP_BASE_DN:-DC=Expressbank,DC=az}
      - LDAP_DOMAIN=${LDAP_DOMAIN:-EXPRESSBANK.AZ}
    ports:
      - "${APP_PORT:-4000}:4000"
    volumes:
      - app_storage:/app/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bank_internal_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ----------------------------------------------------------------------------
  # 2. PostgreSQL 16 Relational Database Engine
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: aegissec-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=bank_admin
      - POSTGRES_PASSWORD=BankSecureAdminPass2026!
      - POSTGRES_DB=bank_infosec_db
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/server/db/postgres/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "127.0.0.1:5432:5432" # Bound strictly to localhost for management
    networks:
      - bank_internal_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank_admin -d bank_infosec_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1024M

  # ----------------------------------------------------------------------------
  # 3. Redis 7 High-Throughput In-Memory Cache & Session Store
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: aegissec-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass RedisSecurePass2026!
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy volatile-lru
    volumes:
      - redis_data:/data
    networks:
      - bank_internal_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "RedisSecurePass2026!", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 512M

  # ----------------------------------------------------------------------------
  # 4. Nginx Reverse Proxy & Load Balancer
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: aegissec-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - bank_internal_network

# ------------------------------------------------------------------------------
# Persistent Volume Declarations
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  app_storage:
    driver: local

# ------------------------------------------------------------------------------
# Isolated Internal Network
# ------------------------------------------------------------------------------
networks:
  bank_internal_network:
    driver: bridge
