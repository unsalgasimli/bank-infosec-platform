# ==============================================================================
# Enterprise Production Docker Compose Topology
# Apex Bank International - Information Security & GRC Platform
# Services: API, worker, scheduler, PostgreSQL 16, Redis 7, RabbitMQ, Nginx
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Bank InfoSec Application Service (Node.js 22 LTS)
  # ----------------------------------------------------------------------------
  app:
    image: ${APP_IMAGE:-aegissec-platform:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegissec-app
    restart: unless-stopped
    environment:
      # Keep production as the safe default, while allowing the local .env to
      # select the development-only authentication behavior explicitly.
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=4000
      - HOST=0.0.0.0
      - DB_TYPE=postgres
      - DB_HOST=pgbouncer
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-${DB_USER:-bank_admin}}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-${DB_PASSWORD:?POSTGRES_PASSWORD or DB_PASSWORD must be set}}
      - DB_NAME=${POSTGRES_DB:-${DB_NAME:-bank_infosec_db}}
      - REDIS_ENABLED=true
      - REDIS_URL=${DOCKER_REDIS_URL:-redis://:${REDIS_PASSWORD:-${DB_PASSWORD:?REDIS_PASSWORD or DB_PASSWORD must be set}}@redis:6379}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-false}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in the deployment environment}
      - DATA_ENCRYPTION_KEY=${DATA_ENCRYPTION_KEY:-${JWT_SECRET:?JWT_SECRET must be set in the deployment environment}}
      - CORTEX_API_KEY=${CORTEX_API_KEY:-}
      - RABBITMQ_ENABLED=true
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-aegissec}:${RABBITMQ_PASSWORD:-${DB_PASSWORD:?RABBITMQ_PASSWORD or DB_PASSWORD must be set}}@rabbitmq:5672/${RABBITMQ_VHOST:-aegissec}
      - RABBITMQ_EXCHANGE=${RABBITMQ_EXCHANGE:-aegissec.events}
      - MALWARE_SCAN_ENABLED=true
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
      - DEV_EMPTY_PASSWORD_LOGIN_ENABLED=${DEV_EMPTY_PASSWORD_LOGIN_ENABLED:-false}
      - CORS_ORIGIN=${CORS_ORIGIN:?CORS_ORIGIN must list trusted browser origins}
      - TRUST_PROXY_HOPS=${TRUST_PROXY_HOPS:-1}
      - LOG_LEVEL=info
      - OTEL_TRACES_ENABLED=${OTEL_TRACES_ENABLED:-false}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-aegissec-platform}
      - LDAP_ENABLED=${LDAP_ENABLED:-true}
      - LDAP_URL=${LDAP_URL:-ldaps://DC01.Expressbank.az:636}
      - LDAP_BASE_DN=${LDAP_BASE_DN:-DC=Expressbank,DC=az}
      - LDAP_DOMAIN=${LDAP_DOMAIN:-EXPRESSBANK.AZ}
      - LDAP_BIND_USER=${LDAP_BIND_USER:?LDAP_BIND_USER must be set for USER SYNC and CMDB discovery}
      - LDAP_BIND_PASSWORD_FILE=/run/secrets/ldap_bind_password
      - LDAP_TLS_REJECT_UNAUTHORIZED=${LDAP_TLS_REJECT_UNAUTHORIZED:-true}
      - LDAP_CA_CERT_PATH=${LDAP_CA_CERT_PATH:-}
    ports:
      - "127.0.0.1:${APP_PORT:-4000}:4000"
    volumes:
      - app_storage:/app/data/storage
    secrets:
      - ldap_bind_password
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      clamav:
        condition: service_healthy
    networks:
      - bank_internal_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # The same immutable image, with no HTTP listener. This process consumes
  # committed outbox events and owns workflow/automation/notification work.
  worker:
    image: ${APP_IMAGE:-aegissec-platform:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegissec-worker
    restart: unless-stopped
    command: ["node", "dist/server/worker.js"]
    # Worker has no HTTP listener; the image-level API healthcheck must not
    # classify a healthy background consumer as unhealthy.
    healthcheck:
      disable: true
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DB_TYPE=postgres
      - DB_HOST=pgbouncer
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-${DB_USER:-bank_admin}}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-${DB_PASSWORD:?POSTGRES_PASSWORD or DB_PASSWORD must be set}}
      - DB_NAME=${POSTGRES_DB:-${DB_NAME:-bank_infosec_db}}
      - REDIS_ENABLED=true
      - REDIS_URL=${DOCKER_REDIS_URL:-redis://:${REDIS_PASSWORD:-${DB_PASSWORD:?REDIS_PASSWORD or DB_PASSWORD must be set}}@redis:6379}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in the deployment environment}
      - DATA_ENCRYPTION_KEY=${DATA_ENCRYPTION_KEY:-${JWT_SECRET:?JWT_SECRET must be set in the deployment environment}}
      - CORTEX_API_KEY=${CORTEX_API_KEY:-}
      - RABBITMQ_ENABLED=true
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-aegissec}:${RABBITMQ_PASSWORD:-${DB_PASSWORD:?RABBITMQ_PASSWORD or DB_PASSWORD must be set}}@rabbitmq:5672/${RABBITMQ_VHOST:-aegissec}
      - RABBITMQ_EXCHANGE=${RABBITMQ_EXCHANGE:-aegissec.events}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-false}
      - MALWARE_SCAN_ENABLED=true
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
      - LDAP_SYNC_AUTO_ENABLED=false
      - LDAP_ENABLED=${LDAP_ENABLED:-true}
      - LDAP_URL=${LDAP_URL:?LDAP_URL must be set for USER SYNC and CMDB discovery}
      - LDAP_BASE_DN=${LDAP_BASE_DN:?LDAP_BASE_DN must be set for USER SYNC and CMDB discovery}
      - LDAP_DOMAIN=${LDAP_DOMAIN:?LDAP_DOMAIN must be set for USER SYNC and CMDB discovery}
      - LDAP_BIND_USER=${LDAP_BIND_USER:?LDAP_BIND_USER must be set for USER SYNC and CMDB discovery}
      - LDAP_BIND_PASSWORD_FILE=/run/secrets/ldap_bind_password
      - LDAP_TLS_REJECT_UNAUTHORIZED=${LDAP_TLS_REJECT_UNAUTHORIZED:-true}
      - LDAP_CA_CERT_PATH=${LDAP_CA_CERT_PATH:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - OTEL_TRACES_ENABLED=${OTEL_TRACES_ENABLED:-false}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-aegissec-platform}
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      clamav:
        condition: service_healthy
    networks:
      - bank_internal_network
    secrets:
      - ldap_bind_password

  # Timed work is deliberately not started in API replicas. It can be moved to
  # a singleton host/leader-elected deployment when the platform is scaled.
  scheduler:
    image: ${APP_IMAGE:-aegissec-platform:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegissec-scheduler
    restart: unless-stopped
    command: ["node", "dist/server/scheduler.js"]
    # Scheduler has no HTTP listener; readiness is represented by its process
    # lifecycle and dependency health, not the API probe.
    healthcheck:
      disable: true
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DB_TYPE=postgres
      - DB_HOST=pgbouncer
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-${DB_USER:-bank_admin}}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-${DB_PASSWORD:?POSTGRES_PASSWORD or DB_PASSWORD must be set}}
      - DB_NAME=${POSTGRES_DB:-${DB_NAME:-bank_infosec_db}}
      - REDIS_ENABLED=true
      - REDIS_URL=${DOCKER_REDIS_URL:-redis://:${REDIS_PASSWORD:-${DB_PASSWORD:?REDIS_PASSWORD or DB_PASSWORD must be set}}@redis:6379}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in the deployment environment}
      - DATA_ENCRYPTION_KEY=${DATA_ENCRYPTION_KEY:-${JWT_SECRET:?JWT_SECRET must be set in the deployment environment}}
      - LDAP_SYNC_AUTO_ENABLED=${LDAP_SYNC_AUTO_ENABLED:-true}
      - LDAP_ENABLED=${LDAP_ENABLED:-true}
      - LDAP_URL=${LDAP_URL:?LDAP_URL must be set for USER SYNC and CMDB discovery}
      - LDAP_BASE_DN=${LDAP_BASE_DN:?LDAP_BASE_DN must be set for USER SYNC and CMDB discovery}
      - LDAP_DOMAIN=${LDAP_DOMAIN:?LDAP_DOMAIN must be set for USER SYNC and CMDB discovery}
      - LDAP_BIND_USER=${LDAP_BIND_USER:?LDAP_BIND_USER must be set for USER SYNC and CMDB discovery}
      - LDAP_BIND_PASSWORD_FILE=/run/secrets/ldap_bind_password
      - LDAP_TLS_REJECT_UNAUTHORIZED=${LDAP_TLS_REJECT_UNAUTHORIZED:-true}
      - LDAP_CA_CERT_PATH=${LDAP_CA_CERT_PATH:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - OTEL_TRACES_ENABLED=${OTEL_TRACES_ENABLED:-false}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-aegissec-platform}
    depends_on:
      pgbouncer:
        condition: service_healthy
    networks:
      - bank_internal_network
    secrets:
      - ldap_bind_password

  # ----------------------------------------------------------------------------
  # 2. PostgreSQL 16 Relational Database Engine. Keep the major version until
  # an explicitly planned pg_upgrade/PITR-tested migration is approved.
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16.9-alpine
    container_name: aegissec-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-${DB_USER:-bank_admin}}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-${DB_PASSWORD:?POSTGRES_PASSWORD or DB_PASSWORD must be set}}
      - POSTGRES_DB=${POSTGRES_DB:-${DB_NAME:-bank_infosec_db}}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/server/db/postgres/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "127.0.0.1:5432:5432" # Bound strictly to localhost for management
    networks:
      - bank_internal_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1024M

  # PgBouncer protects PostgreSQL from unbounded API/worker connection pools.
  # Application roles connect only through this internal endpoint; PostgreSQL's
  # localhost port remains an explicit break-glass administration path.
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    container_name: aegissec-pgbouncer
    restart: unless-stopped
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-${DB_USER:-bank_admin}}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-${DB_PASSWORD:?POSTGRES_PASSWORD or DB_PASSWORD must be set}}
      - DB_NAME=${POSTGRES_DB:-${DB_NAME:-bank_infosec_db}}
      # PostgreSQL 16 initializes credentials with SCRAM by default.
      - AUTH_TYPE=scram-sha-256
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=200
      - DEFAULT_POOL_SIZE=20
      - RESERVE_POOL_SIZE=5
      - SERVER_RESET_QUERY=DISCARD ALL
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bank_internal_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U $$DB_USER -d $$DB_NAME"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ----------------------------------------------------------------------------
  # 3. Redis 7 High-Throughput In-Memory Cache & Session Store
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7.4.2-alpine
    container_name: aegissec-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-${DB_PASSWORD:?REDIS_PASSWORD or DB_PASSWORD must be set}}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy volatile-lru
    volumes:
      - redis_data:/data
    networks:
      - bank_internal_network
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-${DB_PASSWORD:?REDIS_PASSWORD or DB_PASSWORD must be set}}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 512M

  # 4. Durable event bus. PostgreSQL outbox records are authoritative and this
  # broker can be recovered/replayed without losing business transactions.
  rabbitmq:
    # 4.1.3-management-alpine fails startup on the supported Docker Desktop
    # host due to its .erlang.cookie ownership; this pinned 3.13 build is
    # verified by the isolated relay integration check.
    image: rabbitmq:3.13.7-management-alpine
    container_name: aegissec-rabbitmq
    hostname: aegissec-rabbitmq
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-aegissec}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-${DB_PASSWORD:?RABBITMQ_PASSWORD or DB_PASSWORD must be set}}
      - RABBITMQ_DEFAULT_VHOST=${RABBITMQ_VHOST:-aegissec}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - bank_internal_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # 5. Malware scanning is a private worker dependency. Objects are written to
  # quarantine and cannot be downloaded before clamd returns an OK verdict.
  clamav:
    image: clamav/clamav:1.4.2_base
    container_name: aegissec-clamav
    restart: unless-stopped
    networks:
      - bank_internal_network
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 3 --no-summary || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  # Opt-in central metrics stack. Enable with:
  # docker compose --profile observability up -d
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: aegissec-prometheus
    restart: unless-stopped
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--web.enable-lifecycle"]
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - bank_internal_network
    depends_on:
      app:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.1.0
    container_name: aegissec-grafana
    restart: unless-stopped
    profiles: ["observability"]
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-aegissec-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-${JWT_SECRET:?JWT_SECRET must be set for the observability profile}}
      - GF_AUTH_ANONYMOUS_ENABLED=false
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/observability/grafana-datasource.yml:/etc/grafana/provisioning/datasources/aegissec.yml:ro
    networks:
      - bank_internal_network
    depends_on:
      prometheus:
        condition: service_started

  # ----------------------------------------------------------------------------
  # 6. Nginx Reverse Proxy & Load Balancer
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: aegissec-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - bank_internal_network

# ------------------------------------------------------------------------------
# Persistent Volume Declarations
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  app_storage:
    driver: local

secrets:
  # The file is supplied by the deployment environment and is never copied
  # into the image or committed to the repository.
  ldap_bind_password:
    file: ${LDAP_BIND_PASSWORD_FILE:?LDAP_BIND_PASSWORD_FILE must point to the approved read-only AD bind secret file}

# ------------------------------------------------------------------------------
# Isolated Internal Network
# ------------------------------------------------------------------------------
networks:
  bank_internal_network:
    driver: bridge
