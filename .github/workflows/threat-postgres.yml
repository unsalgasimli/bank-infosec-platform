name: Threat Modeling PostgreSQL security integration
on:
  pull_request:
  push:
    branches: [main, master]
jobs:
  threat-postgres-required:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fresh baseline-to-HEAD migrations, replay and non-skipping security suites
        run: node scripts/test-threat-postgres.mjs
