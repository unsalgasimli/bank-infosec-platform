apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: aegissec-secrets-sync
  namespace: bank-infosec
  labels:
    app.kubernetes.io/name: aegissec
spec:
  # Requires the bank-operated External Secrets controller and ClusterSecretStore.
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bank-vault
  target:
    name: aegissec-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef: { key: kv/aegissec/production, property: DATABASE_URL }
    - secretKey: DB_PASSWORD
      remoteRef: { key: kv/aegissec/production, property: DB_PASSWORD }
    - secretKey: REDIS_PASSWORD
      remoteRef: { key: kv/aegissec/production, property: REDIS_PASSWORD }
    - secretKey: RABBITMQ_URL
      remoteRef: { key: kv/aegissec/production, property: RABBITMQ_URL }
    - secretKey: JWT_SECRET
      remoteRef: { key: kv/aegissec/production, property: JWT_SECRET }
    - secretKey: DATA_ENCRYPTION_KEY
      remoteRef: { key: kv/aegissec/production, property: DATA_ENCRYPTION_KEY }
    - secretKey: S3_ACCESS_KEY_ID
      remoteRef: { key: kv/aegissec/production, property: S3_ACCESS_KEY_ID }
    - secretKey: S3_SECRET_ACCESS_KEY
      remoteRef: { key: kv/aegissec/production, property: S3_SECRET_ACCESS_KEY }
