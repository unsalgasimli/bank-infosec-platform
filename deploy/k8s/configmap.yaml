apiVersion: v1
kind: ConfigMap
metadata:
  name: aegissec-config
  namespace: bank-infosec
  labels:
    app.kubernetes.io/name: aegissec
    app.kubernetes.io/part-of: bank-infosec-platform
data:
  NODE_ENV: "production"
  PORT: "4000"
  HOST: "0.0.0.0"
  DB_TYPE: "postgres"
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "bank_infosec_db"
  DB_POOL_MIN: "4"
  DB_POOL_MAX: "25"
  DB_SSL: "false"
  REDIS_ENABLED: "true"
  REDIS_URL: "redis://:$(REDIS_PASSWORD)@redis-service:6379"
  STORAGE_PROVIDER: "s3"
  S3_BUCKET: "apex-bank-infosec-artifacts"
  S3_REGION: "us-east-1"
  LOG_LEVEL: "info"
  CORS_ORIGIN: "http://infosec.apexbank.int"
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX_REQUESTS: "2000"
